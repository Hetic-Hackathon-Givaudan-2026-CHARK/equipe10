name: Comparaison V1 / V2 (modèles réels)

# Interroge la V1 (corpus et ingestion du mardi 10 novembre, prompt et LLM
# d'origine qwen2.5:1.5b) avec les mêmes 30 + 10 cas que la V2, sur les serveurs
# GitHub avec les vrais modèles Ollama, puis ajoute le rapport dans results/.
# Déclenchement : bouton « Run workflow » dans l'onglet Actions, ou modification
# de .github/compare-trigger sur n'importe quelle branche.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/compare-trigger

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EMBED_MODEL: qwen3-embedding:4b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances Python
        run: pip install -r requirements.txt

      - name: Ollama et modèles
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) || true
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 2; done
          ollama pull "$EMBED_MODEL"
          ollama pull qwen2.5:1.5b

      - name: Comparaison sans IA puis avec les modèles
        run: |
          python generate_dataset.py
          python compare_v1_v2.py
          python compare_v1_v2.py --models

      - name: Résumé
        if: always()
        run: |
          for f in results/comparaison_v1_v2*.md; do [ -f "$f" ] && sed -n '1,40p' "$f" >> "$GITHUB_STEP_SUMMARY"; done
          tail -n 20 /tmp/ollama.log || true

      - name: Ajouter les résultats au dépôt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/comparaison_v1_v2*
          if git diff --cached --quiet; then echo "Aucun résultat nouveau."; exit 0; fi
          git commit -m "Résultats de la comparaison V1 / V2 (GitHub Actions, CPU)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
