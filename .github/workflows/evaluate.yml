name: Évaluation des modèles

# Lance l'évaluation avec les vrais modèles (Ollama) sur les serveurs GitHub,
# un LLM par serveur en parallèle, puis ajoute les rapports dans results/.
# Déclenchement : bouton « Run workflow » dans l'onglet Actions (choisir la
# branche), ou modification de .github/eval-trigger sur main.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/v22
    paths:
      - .github/eval-trigger

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        llm: ["qwen2.5:1.5b", "qwen2.5:3b"]
    env:
      EMBED_MODEL: qwen3-embedding:4b
      LLM_MODEL: ${{ matrix.llm }}
      LABEL: v22_qwen3_llm${{ matrix.llm == 'qwen2.5:3b' && '3b' || '1.5b' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances Python
        run: pip install -r requirements.txt

      - name: Ollama et modèles
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &) || true
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 2; done
          ollama pull "$EMBED_MODEL"
          ollama pull "$LLM_MODEL"

      - name: Dataset, tests et indexation
        run: |
          python generate_dataset.py
          python -m pytest -q
          python clean.py && python ingest.py

      - name: Évaluation (30 cas de référence + 10 cas inédits)
        run: |
          python evaluate.py --label "$LABEL"
          python evaluate.py --label "${LABEL}_inedits" --cases data/eval/unseen_cases.json

      - name: Résumé
        if: always()
        run: |
          for f in results/eval_${LABEL}*.md; do [ -f "$f" ] && sed -n '1,18p' "$f" >> "$GITHUB_STEP_SUMMARY"; done
          tail -n 20 /tmp/ollama.log || true

      - name: Ajouter les résultats au dépôt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/eval_${LABEL}*
          if git diff --cached --quiet; then echo "Aucun résultat nouveau."; exit 0; fi
          git commit -m "Résultats de l'évaluation ${LABEL} (GitHub Actions, CPU)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
